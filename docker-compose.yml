services:
  backend:
    build:
      context: ./axis-aura-Back-End-june-2026
      dockerfile: Dockerfile
    container_name: axis-aura-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./axis-aura-Back-End-june-2026/.env
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      HOTSPOT_FRONTEND_URL: http://localhost:3000
      # Browser origins allowed to call the API. Required — cookie-authenticated
      # writes are rejected when the request Origin isn't listed here.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - axis-aura-net

  dashboard:
    build:
      context: ./axis-aura-properities-dashbaord-june-2026
      dockerfile: Dockerfile
    container_name: axis-aura-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      # Server-side only. Must match the API's JWT_SECRET — middleware verifies
      # the session cookie signature with it.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      - backend
    networks:
      - axis-aura-net

volumes:
  backend-uploads:

networks:
  axis-aura-net:
    driver: bridge
