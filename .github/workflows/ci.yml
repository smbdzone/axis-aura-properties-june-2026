name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + audit + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axis-aura-Back-End-june-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: axis-aura-Back-End-june-2026/package-lock.json
      - run: npm ci
      - name: Typecheck / build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high

  dashboard:
    name: Dashboard (lint + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axis-aura-properities-dashbaord-june-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: axis-aura-properities-dashbaord-june-2026/package-lock.json
      - run: npm ci
      # Informational until the pre-existing lint debt is cleared, then drop
      # continue-on-error to make it a hard gate.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          # Build-time placeholder; real values are set in the deploy environment.
          JWT_SECRET: ci-placeholder-secret-not-used-at-runtime-000000
      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high

  public-site:
    name: Public site (lint + build + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Informational until the pre-existing lint debt is cleared.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high
