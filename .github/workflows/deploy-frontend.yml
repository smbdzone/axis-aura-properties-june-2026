name: Deploy Frontend
on:
  push:
    branches: [main]
    paths-ignore:
      - 'axis-aura-Back-End-june-2026/**'
      - 'axis-aura-properities-dashbaord-june-2026/**'
jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/smbdzone/axis-aura-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/smbdzone/axis-aura-properties-june-2026
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            docker login ghcr.io -u ${{ github.actor }} --password ${{ secrets.GHCR_TOKEN }}
            docker pull ghcr.io/smbdzone/axis-aura-frontend:latest
            docker stop axis-aura-frontend-canary 2>/dev/null || true
            docker rm axis-aura-frontend-canary 2>/dev/null || true
            docker run -d --name axis-aura-frontend-canary --restart unless-stopped \
              -p 3013:3000 \
              --env-file /opt/envs/axis-aura-frontend.env \
              ghcr.io/smbdzone/axis-aura-frontend:latest
            sleep 15
            if docker ps --filter "name=axis-aura-frontend-canary" --filter "status=running" | grep -q axis-aura-frontend-canary; then
              docker stop axis-aura-frontend 2>/dev/null || true
              docker rm axis-aura-frontend 2>/dev/null || true
              docker stop axis-aura-frontend-canary
              docker rm axis-aura-frontend-canary
              docker run -d --name axis-aura-frontend --restart unless-stopped \
                -p 3011:3000 \
                --env-file /opt/envs/axis-aura-frontend.env \
                ghcr.io/smbdzone/axis-aura-frontend:latest
              echo "Frontend deployment successful"
            else
              docker stop axis-aura-frontend-canary 2>/dev/null || true
              docker rm axis-aura-frontend-canary 2>/dev/null || true
              echo "Canary failed — rolled back"
              exit 1
            fi
